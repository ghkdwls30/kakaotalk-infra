services:
  kakaotalk-server:
    image: ${SERVER_IMAGE:-kakaotalk-server:latest}
    container_name: kakaotalk-server
    restart: unless-stopped
    network_mode: host
    environment:
      - TZ=Asia/Seoul
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-prd}
      - JAVA_OPTS=${JAVA_OPTS:--Xms2048m -Xmx4096m -Dfile.encoding=UTF-8}
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ./data:/app/data
      - ./uploads:/app/uploads
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/actuator/health || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 12
      start_period: 5s
