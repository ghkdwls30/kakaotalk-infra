# ========================================================
# Kakaotalk Shared Infrastructure (공통 인프라 통합 실행 Compose)
# ========================================================
# - 통합 실행: docker compose up -d
# - 개별 실행: cd postgres && docker compose up -d (각 디렉터리별 독립 실행 가능)
# ========================================================

services:
  # ------------------------------------------------------
  # 1. 고성능 데이터베이스 (PostgreSQL 16)
  # ------------------------------------------------------
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:16-alpine}
    container_name: postgres
    restart: unless-stopped
    network_mode: host
    shm_size: ${POSTGRES_SHM_SIZE:-2g}
    env_file:
      - ./postgres/.env
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ./postgres/data:/var/lib/postgresql/data
    command:
      - "postgres"
      - "-c"
      - "max_connections=${PG_MAX_CONNECTIONS:-300}"
      - "-c"
      - "random_page_cost=${PG_RANDOM_PAGE_COST:-1.1}"
      - "-c"
      - "effective_io_concurrency=${PG_EFFECTIVE_IO_CONCURRENCY:-200}"
      - "-c"
      - "shared_buffers=${PG_SHARED_BUFFERS:-4GB}"
      - "-c"
      - "effective_cache_size=${PG_EFFECTIVE_CACHE_SIZE:-12GB}"
      - "-c"
      - "work_mem=${PG_WORK_MEM:-32MB}"
      - "-c"
      - "maintenance_work_mem=${PG_MAINTENANCE_WORK_MEM:-512MB}"
      - "-c"
      - "wal_buffers=16MB"
      - "-c"
      - "checkpoint_completion_target=0.9"
      - "-c"
      - "max_wal_size=2GB"
      - "-c"
      - "min_wal_size=512MB"
      - "-c"
      - "max_parallel_workers_per_gather=2"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${POSTGRES_USER:-admin} -d ${POSTGRES_DB:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ------------------------------------------------------
  # 2. 사설 도커 레지스트리 (Docker Registry 2)
  # ------------------------------------------------------
  docker-registry:
    image: ${REGISTRY_IMAGE:-registry:2}
    container_name: docker-registry
    restart: unless-stopped
    ports:
      - "${REGISTRY_PORT:-5000}:5000"
    env_file:
      - ./docker-registry/.env
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ./docker-registry/data:/var/lib/registry

  # ------------------------------------------------------
  # 3. CI/CD 자동화 서버 (Jenkins LTS)
  # ------------------------------------------------------
  jenkins:
    image: ${JENKINS_IMAGE:-jenkins/jenkins:lts-jdk17}
    container_name: jenkins
    restart: unless-stopped
    user: "${JENKINS_USER:-root}"
    ports:
      - "${JENKINS_PORT:-9090}:8080"
      - "${JENKINS_AGENT_PORT:-50000}:50000"
    env_file:
      - ./jenkins/.env
    environment:
      - TZ=Asia/Seoul
      - JAVA_OPTS=${JENKINS_JAVA_OPTS:--Duser.timezone=Asia/Seoul -Dfile.encoding=UTF-8}
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ./jenkins/jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
      - /usr/bin/docker:/usr/bin/docker:ro
      - /usr/libexec/docker/cli-plugins:/usr/libexec/docker/cli-plugins:ro
